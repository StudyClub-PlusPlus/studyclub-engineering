# 라벨 SSOT. 이 파일이 정본이고, 반영은 `.github/scripts/sync-labels.sh` 로 한다.
#
# 3축 구조
#   area:   코드 위치. .github/labeler.yml 이 변경 경로를 보고 자동 부여한다.
#   type:   변경 종류. PR 제목의 컨벤셔널 프리픽스에서 자동 부여한다.
#   squad:  조직 스쿼드(팀원 DB 기준). 수동.
#   domain: 제품 도메인(도메인 문서 기준). 수동.
#
# squad 와 domain 은 서로 다른 분류다 — squad 는 "누가", domain 은 "무엇을".
# 이름이 겹치는 study 도 별개 축이므로 접두사로 구분한다.
# 멤버-스쿼드 매핑은 docs/team.md 참조.

# ── area ────────────────────────────────────────────────────────────
