name: playground-beta-CI

on:
  push:
    branches: [beta]
    tags: [playground**]
    paths:
      - 'frontend/apps/playground/**'
      - 'frontend/packages/**'
      - '01-planning/stories/**'
      # pnpm-lock.yaml·package.json·turbo.json·tsconfig.base.json 같은 루트 설정
      - 'frontend/*'
      - '.github/workflows/playground-beta.yaml'
  pull_request:
    paths:
      - 'frontend/apps/playground/**'
      - 'frontend/packages/**'
      - '01-planning/stories/**'
      - 'frontend/*'
      - '.github/workflows/playground-beta.yaml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # setup-node 의 cache: pnpm 이 pnpm 실행 파일을 찾으므로 먼저 설치한다.
      # 버전은 frontend/package.json 의 packageManager 를 따른다 (루트엔 package.json 이 없다).
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: npx turbo run lint typecheck --filter=playground
        working-directory: frontend
      # 설명 보기(spec.ts)와 PRD 가 갈리면 막는다 — 손으로 두 벌 맞추지 않는다
      - run: pnpm --filter playground export-specs -- --check
        working-directory: frontend

