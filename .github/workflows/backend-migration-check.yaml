# 마이그레이션 검증 게이트.
#
# stage 는 Flyway 를 끄고 Hibernate(ddl-auto: update)가 스키마를 만든다
# (docs/backend-development-guide/database-guide.md §환경별). 그래서 그냥 두면
# V*.sql 이 **처음 실행되는 곳이 prod** 가 된다 — 오타 하나가 운영 배포에서 처음 터진다.
#
# 여기서 빈 MySQL 8 에 마이그레이션을 처음부터 적용하고 ddl-auto: validate 로 앱을 띄운다.
# 부팅이 성공하면 두 가지가 같이 증명된다:
#   1) 마이그레이션 SQL 이 실제 MySQL 에서 돈다 (H2 테스트로는 못 잡는다)
#   2) 엔티티 매핑과 마이그레이션이 만든 스키마가 일치한다 (validate 통과)
#
# stage 를 리허설로 쓰는 것보다 정확하다 — 여기는 항상 빈 DB 에서 시작한다.
name: backend-migration-check

on:
  pull_request:
    branches: [beta, develop, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-migration-check.yaml'
  push:
    branches: [beta, develop, main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    services:
      mysql:
        # 로컬·운영과 같은 8.0. 값은 CI 안에서만 사는 더미다 (운영 자격증명 아님).
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: studyclub
          MYSQL_USER: studyclub
          MYSQL_PASSWORD: ci-studyclub
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test (H2)
        working-directory: backend
        run: ./gradlew :api:test --no-daemon

      - name: Build bootJar
        working-directory: backend
        run: ./gradlew :api:bootJar --no-daemon

      # 빈 DB → Flyway 가 V1..Vn 적용 → Hibernate validate → 부팅 성공해야 통과.
      # 실패하면 마이그레이션이 틀렸거나 엔티티와 어긋난 것이다. 로그를 그대로 뱉는다.
      - name: Migrate from empty DB and boot with validate
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/studyclub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
          DB_USERNAME: studyclub
          DB_PASSWORD: ci-studyclub
          FLYWAY_ENABLED: 'true'
          DDL_AUTO: validate
          JWT_SECRET: ci-only-not-a-real-secret
        run: |
          java -jar api/build/libs/app.jar --server.port=8080 > boot.log 2>&1 &
          pid=$!
          for i in $(seq 1 60); do
            if curl -sf -m 2 localhost:8080/api/health > /dev/null; then
              echo "✅ 마이그레이션 적용 + validate 통과 + 부팅 성공"
              kill $pid; exit 0
            fi
            kill -0 $pid 2>/dev/null || { echo "❌ 부팅 중 종료됨"; cat boot.log; exit 1; }
            sleep 2
          done
          echo "❌ 120초 안에 안 떴다"; cat boot.log; kill $pid; exit 1

      # 방금 빈 DB 에 Flyway 가 만든 스키마 = 이 커밋의 진짜 DB 구조. 그대로 읽어 Strata(ERD 지도)로 보낸다.
      # PR 이면 beta 대비 바뀐 테이블·컬럼과 위험한 변경(컬럼 삭제 · default 없는 NOT NULL …)을 코멘트로 남긴다.
      # 포크 PR 은 시크릿이 없어 건너뛴다. 실패해도 검증 게이트는 막지 않는다
      - name: DB 구조를 Strata 로 (ERD)
        id: strata
        if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        env:
          STRATA_TOKEN: ${{ secrets.STRATA_TOKEN }}
          STRATA_API: https://strata-api.studyclub.life
          STRATA_PROJECT: faccbf09-16da-4012-aeca-6595dadf39c6/projects/fa485ab4-54ec-43bc-a9b5-9b330d30687c
          SOURCE: studyclub-engineering:backend
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mysql --default-character-set=utf8mb4 -h 127.0.0.1 -P 3306 -u studyclub -pci-studyclub studyclub -N -B -r < scripts/strata/erd.sql > erd.json
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          jq -n --slurpfile erd erd.json --arg source "$SOURCE" --arg repo "$GITHUB_REPOSITORY" --arg branch "$branch" \
            --arg sha "${HEAD_SHA:-$GITHUB_SHA}" --arg pr "$PR" --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$PR" \
            '{source:$source, repo:$repo, branch:$branch, baseBranch:"beta", sha:$sha, method:"introspect", erd:$erd[0]}
             + (if $pr != "" then {pr:($pr|tonumber), prUrl:$url} else {} end)' > body.json
          code=$(curl -s -o res.json -w '%{http_code}' -X POST "$STRATA_API/teams/$STRATA_PROJECT/schema/snapshots" \
            -H "authorization: Bearer $STRATA_TOKEN" -H 'content-type: application/json' --data-binary @body.json)
          if [ "${code:0:1}" != 2 ]; then echo "::warning::Strata 가 $code 로 거절 — $(head -c 300 res.json)"; exit 1; fi
          jq -r .comment res.json > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: ERD 변경 PR 코멘트 (있으면 고치고 없으면 만든다)
        if: steps.strata.outcome == 'success' && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SOURCE: studyclub-engineering:backend
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"<!-- strata:schema -->\") and contains(\"### DB 구조 · $SOURCE\")) | .id" | head -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md >/dev/null
          else gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@comment.md >/dev/null; fi

      - name: 적용된 스키마 출력 (실패 원인 파악용)
        if: always()
        run: |
          mysql -h 127.0.0.1 -P 3306 -u studyclub -pci-studyclub studyclub \
            -e "SHOW TABLES; SELECT version, description, success FROM flyway_schema_history;" || true
