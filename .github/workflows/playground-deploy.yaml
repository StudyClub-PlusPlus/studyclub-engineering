name: playground-deploy

on:
  push:
    branches: [beta]
    tags: [playground**]
    paths:
      - 'frontend/apps/playground/**'
      - 'frontend/packages/**'
      # pnpm-lock.yaml·package.json·turbo.json·tsconfig.base.json 같은 루트 설정
      - 'frontend/*'
      - '.github/workflows/playground-deploy.yaml'
  workflow_dispatch:

# 배포가 겹쳐 오래된 빌드가 최신 이미지를 덮어쓰지 않게 직렬화한다.
# 도중 취소는 하지 않는다 — SSH 배포가 어디까지 됐는지 알 수 없게 된다.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.BUILD_SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      # playground 는 mock 데이터만 쓴다 → NEXT_PUBLIC_* build-arg 없음
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/apps/playground/Dockerfile
          push: true
          tags: hyperrealitycorp/studyclub-playground-production
          platforms: linux/amd64
          build-args: |
            NODE_ENV=production
            COMMIT_HASH=${{ github.sha }}
      - name: Deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.REMOTE_SSH_IP }}
          username: ${{ secrets.REMOTE_SSH_ID }}
          password: ${{ secrets.REMOTE_SSH_PASSWORD }}
          port: ${{ secrets.REMOTE_SSH_PORT }}
          script: |
            source ~/.bashrc
            bash ./deployment/studyclub/playground-production.sh
      - uses: act10ns/slack@v1
        continue-on-error: true
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
          channel: '#build-status'
        if: always()
