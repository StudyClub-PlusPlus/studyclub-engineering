<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>회차 설정 와이어프레임</title><link rel="stylesheet" href="wf.css">
<style>
  .grid { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .item { background: #fff; border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; text-decoration: none; color: inherit; display: block; }
  .thumb { height: 330px; overflow: hidden; position: relative; background: var(--s2); border-bottom: 1px solid var(--border); }
  .thumb iframe { width: 1290px; height: 1000px; border: 0; transform: scale(.465); transform-origin: 0 0; pointer-events: none; }
  .meta { padding: 12px 16px; }
  .meta b { display: block; }
  .meta span { color: var(--fg-muted); font-size: 13px; }
  header { max-width: 1240px; margin: 0 auto 20px; }
  header h1 { margin: 0 0 4px; font-size: 22px; }
  header p { margin: 0; color: var(--fg-muted); }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
</style></head>
<body><div class="page">
<header><h1>회차 설정 와이어프레임</h1>
<p>백오피스 스터디 상세 「회차」 탭 — 구글 캘린더처럼. 예시: 시스템 디자인 1기 · 목요일반 · 매주 목 20:00 · 8회 · 오늘 10/20.<br/>
01~10 기본 화면 · 11~16 일정 패턴 조합 — <a href="../../../docs/journeys/combinations.md">조합표</a><br/>흐름·규칙: <a href="../../../docs/flows/meeting.md">회차</a> · 화면 설명: <a href="../../../docs/flows/meeting-ui.md">회차 설정 UI</a> · API: <a href="../spec.md">meeting spec</a></p></header>
<div class="grid" id="g"></div>
</div>
<script>
const items = [
  ['01-calendar.html', '01 · 회차 탭 — 달력', '한 달 보기 · 상태별 칩 · 반복 일정 패널'],
  ['02-popover.html', '02 · 회차 팝오버', '예정 · 열림 · 휴강 · 예외 · 닫힘 · 단건마다 다른 버튼'],
  ['03-scope.html', '03 · 범위 묻기', '이 회차만 · 이 회차 및 이후 · 모든 회차 (수정 / 삭제)'],
  ['04-series-create.html', '04 · 반복 일정 만들기', '입력하는 즉시 달력에 미리보기'],
  ['05-multi-select.html', '05 · 여러 개 선택', '휴강 · 미루기 · 시각 변경 · 삭제를 한 번에'],
  ['06-defer-impact.html', '06 · 미루기 — 영향 요약', '옮겨지는 회차 · 끝 · 풀리는 휴가 · 알림'],
  ['07-after-defer.html', '07 · 미룬 뒤', '변경 배지 · 원래 자리 유령 칩'],
  ['08-crew-view.html', '08 · 크루 화면', '다음 회차 · 회차 목록 · 알림'],
  ['09-crew-checkin.html', '09 · 크루 체크인', '시작 전 · 열림 · 완료 · 지각 · 휴가 · 결석 + 클럽 방식 3종'],
  ['10-attendance-grid.html', '10 · 운영자 출석 탭', '진행 중 열 · 옮긴 회차 · 휴강 열 · 정정 · 닫힌 회차만 센다'],
  ['11-two-groups.html', '11 · 분반 2개', '조합 B — 두 반 모두 보기 · 공동 휴강 · 이번만 다른 반'],
  ['12-weekdays-biweekly.html', '12 · 여러 요일 · 격주', '조합 C·D — 격주 기준 주 · 미루기 한 칸 / 그 주 전체'],
  ['13-daily-club.html', '13 · 매일 클럽', '조합 E — 하루 요약 달력 · 31열 히트맵'],
  ['14-range-break.html', '14 · 여러 주 쉬기', '조합 A·B·E — 기간으로 고르기 · 휴강 / 미루기'],
  ['15-club-next-cohort.html', '15 · 클럽 다음 기수', '조합 E — 복사 · 명부 이월 · 펼치기'],
  ['16-crew-leave-pause.html', '16 · 크루 불참 · 잠시 쉼', '여러 회차 휴가 · 쉼 기간 · 격자의 쉼 구간'],
];
document.getElementById('g').innerHTML = items.map(([f, t, d]) =>
  `<a class="item" href="${f}"><div class="thumb"><iframe src="${f}" loading="lazy" tabindex="-1"></iframe></div>
   <div class="meta"><b>${t}</b><span>${d}</span></div></a>`).join('');
</script>
</body></html>
