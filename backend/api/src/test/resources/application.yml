# 테스트 전용 설정. MySQL 컨테이너 없이 도는 것이 목적 — 테스트가 인프라를 요구하면 아무도 안 돌린다.
#
# ⚠️ 한계: Flyway 를 끄고 스키마를 엔티티에서 생성한다. 따라서 이 테스트들은
#    **마이그레이션 SQL 이 맞는지는 검증하지 않는다** (V1__init.sql 은 MySQL 전용 DDL).
#    마이그레이션 검증이 필요해지면 Testcontainers(MySQL) 로 올린다.
spring:
  datasource:
    url: jdbc:h2:mem:studyclub;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
      naming:
        physical-strategy: com.studyclub.api.config.UpperCaseTableNamingStrategy
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  secret: test-only-secret

mail:
  notify:
    region: ap-northeast-2
    sub-domain: notify.test.studyclub.life
    from-address: notify@test.studyclub.life
    access-key-id: test-access-key
    secret-access-key: test-secret-key

# 이 모듈과 무관한 기존 통합 테스트가 @SpringBootTest 로 전체 컨텍스트를 띄울 때 스케줄러가 같이 깨어나
# 실제 SES 호출을 시도하지 않도록 기본은 꺼둔다. 스케줄러 테스트는 poll() 을 직접 호출해 시각 의존 없이 검증한다.
notification:
  site-base-url: http://localhost:4700
  back-office-base-url: http://localhost:4701
  polling:
    enabled: false

# 업로드 정리 배치도 같은 이유로 끈다. 배치 테스트는 cleanUp() 을 직접 부른다.
feedback:
  retention:
    enabled: false

upload:
  cleanup:
    enabled: false

analytics:
  deletion:
    enabled: false
cleanup:
  enabled: false

# 최고 관리자 (specs/admin-users 「최고 관리자」) — 캡틴을 크루로 내리는 통합 테스트의 요청자들.
# 클래스마다 @SpringBootTest(properties) 로 주면 컨텍스트가 늘어 같은 H2 를 쓰는 다른 컨텍스트가 닫히며 스키마를 지운다. 여기 한 곳에 둔다
super-admin:
  emails: acctlist-9901@example.com,rolechange-9921@example.com,concurrency-9961@example.com,other@owner-test.com
