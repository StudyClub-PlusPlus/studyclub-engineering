# 테스트 전용 설정. MySQL 컨테이너 없이 도는 것이 목적 — 테스트가 인프라를 요구하면 아무도 안 돌린다.
#
# ⚠️ 한계: Flyway 를 끄고 스키마를 엔티티에서 생성한다. 따라서 이 테스트들은
#    **마이그레이션 SQL 이 맞는지는 검증하지 않는다** (V1__init.sql 은 MySQL 전용 DDL).
#    마이그레이션 검증이 필요해지면 Testcontainers(MySQL) 로 올린다.
spring:
  datasource:
    url: jdbc:h2:mem:studyclub;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
      naming:
        physical-strategy: com.studyclub.api.config.UpperCaseTableNamingStrategy
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  secret: test-only-secret

mail:
  notify:
    region: ap-northeast-2
    sub-domain: notify.test.studyclub-plusplus.com
    from-address: notify@test.studyclub-plusplus.com
    access-key-id: test-access-key
    secret-access-key: test-secret-key

# 이 모듈과 무관한 기존 통합 테스트가 @SpringBootTest 로 전체 컨텍스트를 띄울 때 스케줄러가 같이 깨어나
# 실제 SES 호출을 시도하지 않도록 기본은 꺼둔다. 스케줄러 테스트는 poll() 을 직접 호출해 시각 의존 없이 검증한다.
notification:
  polling:
    enabled: false
