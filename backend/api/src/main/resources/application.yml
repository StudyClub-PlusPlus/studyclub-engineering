server:
  port: 8080
  tomcat:
    # 5MB 초과로 거부한 요청의 남은 본문을 끝까지 읽는다. 기본값(2MB)이면 Tomcat 이 연결을 끊어
    # 브라우저가 400 응답 대신 네트워크 오류를 본다. multipart max-request-size 와 같은 값.
    max-swallow-size: 6MB

spring:
  config:
    import: classpath:notification.yml
  # 이미지 올리기 상한 — 파일 5MB, 요청(파일 + purpose 파트) 6MB. 넘치면 400 INVALID_INPUT.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: studyclub-api
  # PUBLIC 레포 — 비밀번호/호스트는 env 로만 주입 (docker-compose → .env, 로컬 host 는 `set -a; source ../.env`).
  # DB_* 가 없으면 루트 .env 의 MYSQL_* 로 compose 의 mysql(호스트 포트)에 붙는다 — 로컬 bootRun 이 .env 하나로 뜨게.
  # 운영·stage 는 DB_* 를 명시 주입하므로 이 기본값을 타지 않는다.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:${MYSQL_PORT:23310}/${MYSQL_DATABASE:studyclub}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:${MYSQL_USER:studyclub}}
    password: ${DB_PASSWORD:${MYSQL_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 스키마의 정본은 db/migration/*.sql (Flyway) 하나다.
  # ddl-auto 기본값 validate — 엔티티가 운영 DB 를 조용히 바꾸지 못하게 막고, 매핑과 실제 스키마가
  # 어긋나면 부팅에서 바로 터뜨린다. prod 는 이 기본값을 그대로 쓴다 (DDL_AUTO 를 주입하지 않는다).
  # stage 만 k8s studyclub-api-stage-env 에서 DDL_AUTO=update 를 넣는다 — docs/.../database-guide.md
  # stage 는 FLYWAY_ENABLED=false — 거기서는 Hibernate(ddl-auto: update)가 스키마를 만든다.
  # 둘을 같이 켜면 Hibernate 가 먼저 만든 컬럼을 나중에 V{n} 이 또 추가하려다 Duplicate column 으로
  # 부팅이 죽는다. 첫 배포는 멀쩡히 지나가고 컬럼을 하나 추가하는 날 터져서 원인이 안 보인다.
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
      # 테이블 대문자 / 컬럼 snake_case 를 코드로 강제 (@Table 을 깜빡해도 규칙이 유지된다)
      naming:
        physical-strategy: com.studyclub.api.config.UpperCaseTableNamingStrategy
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  # 구글 OAuth (GCP 콘솔에서 클라이언트 생성 후 env 로 주입 — 비어있어도 부팅됨)
google:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}
  redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:4700/api/auth/callback}

# 파일 저장소 (specs/profile-image/spec.md, docs/s3-storage.md). 키·버킷·주소는 env 로만.
# 전부 비어 있어도 부팅된다 — 로컬처럼 키가 없는 환경에서는 올리기만 503 EXTERNAL_SERVICE_ERROR.
# public-base-url 은 CloudFront 주소에 /studyclub 까지 (값은 인프라 담당자에게 요청).
storage:
  s3:
    region: ${AWS_REGION:}
    bucket: ${S3_BUCKET:}
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
    public-base-url: ${S3_PUBLIC_BASE_URL:}
  # 로컬 개발용 — 키 없이 사진 기능을 끝까지 돌려 본다. 켜면 S3 대신 로컬 폴더에 쓰고 API 가 /local-storage/** 로 내준다.
  # 운영에서는 켜지 않는다 (꺼져 있어야 키가 빠졌을 때 503 으로 드러난다).
  local:
    enabled: ${STORAGE_LOCAL_ENABLED:false}
    dir: ${STORAGE_LOCAL_DIR:${java.io.tmpdir}/studyclub-storage}
    public-base-url: ${STORAGE_LOCAL_PUBLIC_BASE_URL:http://localhost:8080/local-storage}

# 이미지 올리기 (specs/profile-image/spec.md). 전부 제안값 — env 없이 기본값으로 두고 테스트에서 줄여 쓴다.
upload:
  pending-limit: 20              # 연결 안 한 파일이 계정에 이만큼이면 더 못 올린다
  pending-retention-hours: 24    # 이 시간 지나도 연결 없으면 정리 배치가 지운다
  cleanup:
    enabled: true
    fixed-delay-ms: 3600000      # 한 시간

# JWT 서명키 (운영은 내부 시크릿 SSOT → env 주입, 레포 평문 금지)
jwt:
  secret: ${JWT_SECRET:local-dev-jwt-secret-change-me}

# API 문서 — 스펙은 springdoc 이 컨트롤러에서 생성하고, UI 는 Scalar 가 그린다 (/scalar).
# JS 번들은 jar 안에 들어있어 CDN 을 타지 않는다.
# 운영에서 스펙을 감추려면 API_DOCS_ENABLED=false 하나로 둘 다 꺼진다.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
scalar:
  enabled: ${API_DOCS_ENABLED:true}
  # UI 가 Scalar 로 사용량을 보내는 기본값을 끈다
  telemetry: false

# 운영자 알림 (specs/ops-alerts/spec.md). 웹훅이 비면 아무것도 보내지 않는다 — 로컬·테스트 기본값.
# APP_ENV 는 제목 접두어용: production → 없음, stage → [Stage], beta → [Beta], 그 밖 → [Local].
# 웹훅 URL 은 토큰이다 — 레포에 적지 않고 env 로만 주입한다.
ops:
  discord-webhook-url: ${OPS_DISCORD_WEBHOOK_URL:}
  env: ${APP_ENV:local}

# 세 env 가 다 비어 있으면 동작이 지금과 완전히 동일하다 (콘솔 텍스트, 파일 안 씀).
#
# 로컬·compose 는 콘솔 텍스트를 그대로 쓴다. k8s 는 LOG_JSON_CONSOLE=ecs 만 주입한다 —
# 파일이 아니라 stdout 으로 내야 kubelet 이 /var/log/containers 로 떨어뜨리고 노드당 Alloy
# DaemonSet 하나가 전부 읽는다. 파일로 쓰면 파드마다 emptyDir + 수집 사이드카가 붙어서
# 수집기가 파드 수만큼 늘어난다. (인프라 레포 ADR 0027)
#
# ⚠️ 기본 콘솔 패턴에는 MDC 가 안 들어간다. 텍스트 stdout 을 수집하면 requestId 가 로그에
#    아예 없어서 요청 추적이 성립하지 않는다 — k8s 에서 이 env 를 켜는 것이 필수인 이유다.
logging:
  structured:
    format:
      console: ${LOG_JSON_CONSOLE:}
      file: ${LOG_JSON_FORMAT:}
  file:
    name: ${LOG_FILE:}
  logback:
    rollingpolicy:
      # ⚠️ max-history 는 파일 개수가 아니라 일수다. 디스크 상한 역할을 하는 것은 total-size-cap 뿐이다.
      max-file-size: 10MB
      max-history: 1
      total-size-cap: 30MB
      # .gz 를 뺀다 — 압축되면 Alloy 의 감시 대상 밖이 된다.
      file-name-pattern: ${LOG_FILE}.%d{yyyy-MM-dd}.%i

# actuator 는 앱 포트가 아니라 관리 포트에서만 산다 (compose 가 호스트에 publish 하지 않는다).
# 외부 헬스체크는 /api/health 를 쓴다.
management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      # 없으면 _bucket 시계열이 안 생겨 histogram_quantile() 이 빈 결과를 준다.
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,500ms,1s,2s
